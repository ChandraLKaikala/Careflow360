name: CareFlow360 repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: careflow360-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 pandas==2.3.3 scikit-learn==1.7.2
      - name: Python, notebooks, YAML, and mirror validation
        run: python CareFlow360_Databricks_Free_Edition/tests/static_validate.py
      - name: Execute synthetic output and DAB contract unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
