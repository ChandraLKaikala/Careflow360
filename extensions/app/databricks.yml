bundle:
  name: careflow360-app
  engine: direct

include:
  - resources/*.yml

variables:
  catalog:
    description: Existing CareFlow360 Unity Catalog catalog.
  schema:
    description: Gold schema; for unified quickstart supply careflow360_dev.
    default: careflow360_gold
  table_prefix:
    description: Empty for Gold presentation views; set gold_ for unified quickstart.
    default: ""
  warehouse_id:
    description: Existing SQL warehouse ID.

targets:
  dev:
    default: true
    mode: development
