resources:
  genie_spaces:
    careflow_genie:
      title: CareFlow360 Hospital Operations Agent
      description: Natural-language analytics over synthetic CareFlow360 hospital operations data.
      warehouse_id: ${var.warehouse_id}
      serialized_space: |
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {"id":"11111111111111111111111111111111","question":["How many patients are currently in the emergency department?"]},
              {"id":"22222222222222222222222222222222","question":["Which department currently has the most admitted patients?"]},
              {"id":"33333333333333333333333333333333","question":["Show synthetic operational alert counts by hour and source (aggregates only)."]},
              {"id":"44444444444444444444444444444444","question":["Compare admissions, transfers and discharges by hour."]}
            ]
          },
          "data_sources": {
            "tables": [
              {"identifier":"${var.catalog}.${var.schema}.${var.table_prefix}patient_360"},
              {"identifier":"${var.catalog}.${var.schema}.${var.table_prefix}hospital_command_center"},
              {"identifier":"${var.catalog}.${var.schema}.${var.table_prefix}department_hourly"},
              {"identifier":"${var.catalog}.${var.schema}.${var.table_prefix}live_alerts"},
              {"identifier":"${var.catalog}.${var.schema}.${var.table_prefix}triage_predictions"}
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                "content":["CareFlow360 contains synthetic/public portfolio data only. Answer operational analytics questions from the listed Gold tables. Do not provide diagnosis, treatment recommendations, medication guidance, or claim that the data represents real patients."]
              },
              {
                "id":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
                "content":["A currently admitted patient is a row in the configured Patient 360 table where is_currently_admitted is true. Use current_department for current census questions. Operational alert flags are synthetic demonstration thresholds, not clinical alerts. Return aggregate counts only; never show patient identifiers, encounter identifiers, or vital-sign records."]
              }
            ]
          }
        }
